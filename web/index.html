<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nearby masjids and their jamat times, from masjid admins and the community.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Masjid Timer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Masjid Timer</title>
  <meta name="theme-color" content="#1B2A4A">
  <style>
    /* Plain-HTML splash in DESIGN.md token colours until Flutter's first frame. */
    body { margin: 0; background: #F7F6F2; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font: 600 15px/1.5 system-ui, sans-serif; color: #545C6B; }
    @media (prefers-color-scheme: dark) {
      body { background: #0D1321; }
      #splash { color: #A3ABBD; }
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="splash" role="status">Masjid Timer · Loading…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
